name: Playwright Tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://www.saucedemo.com/
      USER_NAME: standard_user
      PASSWORD: secret_sauce
      FIRST_NAME: John
      LAST_NAME: Snow
      ZIP_CODE: '123456'
      BLOCKED_USER_NAME: locked_out_user
      WRONG_PASSWORD: wrong_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Install browsers and system dependencies
        run: npx playwright install --with-deps
      - name: Run tests
        run: npm test
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run generate:allure
      - name: Save reports and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            allure-results/
            allure-report/
            playwright-report/
            test-results/
          retention-days: 14
      - name: Publish Allure to GitHub Pages
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./allure-report
